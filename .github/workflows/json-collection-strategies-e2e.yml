name: JSON Collection Strategies E2E

on:
  pull_request:
    branches: [master]
    paths:
      - "deepdiff/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/json-collection-strategies-e2e.yml"
  push:
    branches:
      - "akshat62/path-scoped-collection-strategies"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-and-regression:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,static,coverage]"
          python -m pip install build

      - name: Compile package and tests
        run: python -m compileall -q deepdiff tests

      - name: Run focused strategy tests
        run: pytest -vv tests/test_json_diff.py --cov=deepdiff.json_diff --cov-report=term-missing

      - name: Run complete regression suite
        run: pytest -q --cov=deepdiff --cov-report=term-missing

      - name: Run static checks
        run: flake8 deepdiff tests

      - name: Build distributions
        run: python -m build

      - name: Wheel installation smoke test
        shell: bash
        run: |
          python -m venv /tmp/deepdiff-wheel-test
          /tmp/deepdiff-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/deepdiff-wheel-test/bin/python -m pip install dist/deepdiff-*.whl
          /tmp/deepdiff-wheel-test/bin/python - <<'PY'
          from deepdiff import CollectionStrategy, DeepDiff, DeepJSONDiff

          assert DeepDiff({"a": 1}, {"a": 1}) == {}
          result = DeepJSONDiff(
              {"users": [{"id": 1, "name": "Alice"}]},
              {"users": [{"id": 1, "name": "Alicia"}]},
              collection_strategies=[
                  CollectionStrategy(path="$.users", match_by=("id",))
              ],
          )
          assert result
          print(result.to_json(indent=2))
          PY

  realistic-e2e:
    name: Realistic JSON scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Execute realistic scenarios
        run: |
          python - <<'PY'
          import copy
          import time

          from deepdiff import CollectionStrategy, DeepDiff, DeepJSONDiff

          expected = {
              "orders": [{
                  "orderId": "O-100",
                  "items": [
                      {
                          "product": {"id": "P-1"},
                          "warehouse": {"code": "HYD"},
                          "quantity": 2,
                          "active": True,
                          "generatedAt": "2026-07-18T10:00:00Z",
                      },
                      {
                          "product": {"id": "P-2"},
                          "warehouse": {"code": "BLR"},
                          "quantity": 3,
                          "active": False,
                      },
                  ],
              }]
          }
          actual = {
              "orders": [{
                  "orderId": "O-100",
                  "items": [
                      {
                          "product": {"id": "P-2"},
                          "warehouse": {"code": "BLR"},
                          "quantity": 999,
                          "active": False,
                      },
                      {
                          "product": {"id": "P-1"},
                          "warehouse": {"code": "HYD"},
                          "quantity": 4,
                          "active": True,
                          "generatedAt": "2026-07-18T11:30:00Z",
                      },
                  ],
              }]
          }

          original_expected = copy.deepcopy(expected)
          original_actual = copy.deepcopy(actual)
          result = DeepJSONDiff(
              expected,
              actual,
              collection_strategies=[
                  CollectionStrategy(
                      path="$.orders[*].items",
                      match_by=("product.id", "warehouse.code"),
                      filter_func=lambda item: item.get("active", True),
                      exclude_fields=("generatedAt",),
                  )
              ],
          )
          output = result.to_dict()
          assert "values_changed" in output
          assert len(output["values_changed"]) == 1
          assert expected == original_expected
          assert actual == original_actual

          reordered_left = {"items": [{"id": i, "value": i} for i in range(10_000)]}
          reordered_right = {"items": [{"id": i, "value": i} for i in reversed(range(10_000))]}
          started = time.perf_counter()
          large_result = DeepJSONDiff(
              reordered_left,
              reordered_right,
              collection_strategies=[CollectionStrategy(path="$.items", match_by=("id",))],
          )
          elapsed = time.perf_counter() - started
          assert not large_result
          assert elapsed < 30, elapsed

          legacy_left = {"users": [{"id": 1}, {"id": 2}]}
          legacy_right = {"users": [{"id": 2}, {"id": 1}]}
          assert DeepDiff(legacy_left, legacy_right) != {}
          assert DeepDiff(legacy_left, legacy_right, ignore_order=True) == {}

          print("realistic scenarios passed", {"large_collection_seconds": elapsed})
          PY
