name: JSON Strategy Diagnostics

on:
  push:
    branches:
      - "akshat62/path-scoped-collection-strategies"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install complete development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cli,coverage,dev,static,test,optimize]"

      - name: Run focused tests
        run: pytest -vv tests/test_json_diff.py --junitxml=focused-junit.xml 2>&1 | tee focused-pytest.log

      - name: Run full suite and retain diagnostics
        id: full-suite
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -vv tests --cov=deepdiff --cov-report=term-missing --junitxml=full-junit.xml 2>&1 | tee full-pytest.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-strategy-test-diagnostics
          path: |
            focused-pytest.log
            focused-junit.xml
            full-pytest.log
            full-junit.xml
          if-no-files-found: error

      - name: Fail when full suite failed
        if: steps.full-suite.outcome == 'failure'
        run: exit 1
